# Scans every auction house in the configured region(s) for current-season BoEs
# and publishes the site + fresh data to GitHub Pages.
#
# Required repository secrets:  BLIZZARD_CLIENT_ID, BLIZZARD_CLIENT_SECRET
# Optional repository variables: REGIONS (default "us,eu"), SCAN_CONCURRENCY (default 6),
#                                 SCAN_INTERVAL_SECONDS (default 600)
name: Scan auctions and deploy

on:
  schedule:
    # Backstop only: GitHub throttles scheduled workflows heavily (runs were firing every ~3 h
    # with a */30 schedule), so each run also dispatches the next one itself 10 minutes after
    # it started (see the last step). Off-peak minutes are used because :00/:30 are congested.
    - cron: '4,14,24,34,44,54 * * * *'
  push:
  workflow_dispatch:
    inputs:
      regions:
        description: 'Regions to scan (comma separated: us, eu, kr, tw). Overrides the REGIONS variable.'
        required: false
        type: string
      delay:
        description: 'Seconds to wait before scanning (set by the self-scheduling chain; leave 0 for a manual run).'
        required: false
        default: '0'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # lets a run dispatch the next one

jobs:
  # The self-scheduling chain waits here, outside the scan/deploy concurrency group, so a push
  # that deploys new code never has to wait behind a sleeping run.
  wait:
    if: github.event_name == 'workflow_dispatch' && inputs.delay != '' && inputs.delay != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait before scanning
        env:
          DELAY: ${{ inputs.delay }}
        run: |
          case "$DELAY" in ''|*[!0-9]*) echo "invalid delay '$DELAY', not waiting"; exit 0;; esac
          [ "$DELAY" -gt 1500 ] && DELAY=1500
          echo "Waiting ${DELAY}s"
          sleep "$DELAY"

  scan-and-deploy:
    needs: [wait]
    # Runs after the wait job (or when it was skipped). Pushes only deploy from the repository's
    # default branch (schedules always run there).
    if: >-
      !cancelled() && (needs.wait.result == 'success' || needs.wait.result == 'skipped') &&
      (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Never run two scans/deploys at the same time; a newer queued run replaces older queued ones.
    concurrency:
      group: scan-and-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Until the Blizzard API secrets exist the job stops here (successfully, so the schedule
      # does not send a failure e-mail every 30 minutes) and prints a warning instead.
      - name: Check configuration
        id: config
        env:
          CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::warning title=Blizzard API secrets missing::Add BLIZZARD_CLIENT_ID and BLIZZARD_CLIENT_SECRET under Settings > Secrets and variables > Actions, then re-run this workflow. Nothing was scanned or deployed."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: npm ci

      - name: Unit tests
        if: steps.config.outputs.configured == 'true'
        run: npm test

      - name: Configure GitHub Pages
        if: steps.config.outputs.configured == 'true'
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build site
        if: steps.config.outputs.configured == 'true'
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Scan auction houses
        if: steps.config.outputs.configured == 'true'
        run: npm run scan -- --out dist/data
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          REGIONS: ${{ inputs.regions || vars.REGIONS || 'us,eu' }}
          SCAN_CONCURRENCY: ${{ vars.SCAN_CONCURRENCY || '6' }}
          # Lets the scanner re-use realms whose auction snapshot has not changed since the last deploy.
          PREVIOUS_DATA_URL: ${{ steps.pages.outputs.base_url }}/data
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Pages artifact
        if: steps.config.outputs.configured == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.config.outputs.configured == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

      # Self-scheduling: queue the next run with a delay so that scans start every
      # SCAN_INTERVAL_SECONDS (default 600). The next run waits in its own 'wait' job. The
      # concurrency group keeps at most one scan pending, so the cron backstop and this chain
      # never pile up. Pushes do not chain (the running chain continues).
      - name: Schedule the next scan
        if: steps.config.outputs.configured == 'true' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ steps.config.outputs.started }}
          INTERVAL: ${{ vars.SCAN_INTERVAL_SECONDS || '600' }}
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          delay=$(( INTERVAL - elapsed ))
          [ "$delay" -lt 0 ] && delay=0
          echo "Scan took ${elapsed}s; next scan in ${delay}s"
          gh workflow run scan-and-deploy.yml --ref "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -f "delay=$delay"
          echo "Next run queued"
